name: Build and publish validated audio — exam 010

on:
  push:
    branches: [main]
    paths:
      - "build_exam_010_aligned.py"
      - "audit_audio_duplicates.py"
      - ".github/workflows/build-exam-010-aligned.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit uniqueness inside exam 010 only
        run: python audit_audio_duplicates.py --exam 10
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate and validate eight tracks
        run: |
          mkdir -p output audio/exam-010
          python build_exam_010_aligned.py
          test "$(find audio/exam-010 -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 8
          test "$(unzip -Z1 output/exam-010.zip | grep -c '\\.mp3$')" -eq 8
          for f in audio/exam-010/*.mp3; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | grep -Eq '^[0-9]+(\\.[0-9]+)?$'
          done
      - name: Commit the eight validated MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/exam-010/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "audio(exam-010): publish eight validated MP3 tracks"
            git push origin HEAD:main
          fi
      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERVO-DEUTSCH-B2-EXAMEN-010-ALIGNED
          path: output/exam-010.zip
          retention-days: 30
      - name: Publish exam 010 as a permanent audio release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-v1
          name: SERVO DEUTSCH B2 — Packs audio
          files: output/exam-010.zip
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
