name: Build exam 004 — validation artifact

on:
  push:
    branches: [human-voice-production]
    paths:
      - "build_exam_004_aligned.py"
      - "audit_audio_duplicates.py"
      - ".github/workflows/build-exam-004-validation.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit distinct content against existing exams
        run: python audit_audio_duplicates.py
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate and validate eight tracks
        run: |
          mkdir -p output
          python build_exam_004_aligned.py
          test "$(unzip -Z1 output/exam-004.zip | grep -c '\.mp3$')" -eq 8
          for f in output/audio/*.mp3; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | grep -Eq '^[0-9]+(\.[0-9]+)?$'
          done
      - name: Publish validated MP3 tracks to the audio repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p audio/exam-004
          cp output/audio/*.mp3 audio/exam-004/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/exam-004/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated audio tracks for exam 004"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SERVO-DEUTSCH-B2-EXAMEN-004-ALIGNED
          path: output/exam-004.zip
          retention-days: 30
