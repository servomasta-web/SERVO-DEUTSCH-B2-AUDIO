name: Build aligned human audio — exam 003

on:
  push:
    branches: [main]
    paths:
      - "build_exam_003_aligned.py"
      - "audit_audio_duplicates.py"
      - ".github/workflows/build-exam-003-aligned.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit duplicate audio content
        run: python audit_audio_duplicates.py
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate and validate the eight aligned tracks
        run: |
          mkdir -p output
          python build_exam_003_aligned.py
          test "$(unzip -Z1 output/exam-003.zip | grep -c '\.mp3$')" -eq 8
      - name: Publish validated MP3 tracks to the audio repository
        run: |
          mkdir -p audio/exam-003
          cp output/audio/*.mp3 audio/exam-003/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/exam-003/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated audio tracks for exam 003"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERVO-DEUTSCH-B2-EXAMEN-003-ALIGNED
          path: output/exam-003.zip
          retention-days: 30
      - name: Publish exam 003 as a permanent audio release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-v1
          name: SERVO DEUTSCH B2 — Packs audio
          files: output/exam-003.zip
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
