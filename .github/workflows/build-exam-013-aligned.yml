name: Build synthetic TTS audio — exam 013

on:
  push:
    branches: [main]
    paths:
      - "build_exam_013_aligned.py"
      - "audit_audio_duplicates.py"
      - ".github/workflows/build-exam-013-aligned.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit distinct content against all existing packs
        run: python audit_audio_duplicates.py
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate and validate eight tracks
        run: |
          mkdir -p output
          python build_exam_013_aligned.py
          test "$(unzip -Z1 output/exam-013.zip | grep -c '\.mp3$')" -eq 8
          for f in output/audio/*.mp3; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | grep -Eq '^[0-9]+(\.[0-9]+)?$'
          done
      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERVO-DEUTSCH-B2-EXAMEN-013-ALIGNED
          path: output/exam-013.zip
          retention-days: 30
      - name: Publish exam 013 as a permanent audio release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-v1
          name: SERVO DEUTSCH B2 — Packs audio
          files: output/exam-013.zip
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
