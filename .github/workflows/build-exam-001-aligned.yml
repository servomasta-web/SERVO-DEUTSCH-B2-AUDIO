name: Rebuild aligned human audio — exam 001

on:
  push:
    branches: [main]
    paths:
      - "build_exam_001_aligned.py"
      - ".github/workflows/build-exam-001-aligned.yml"
  workflow_dispatch:

concurrency:
  group: servo-audio-publication-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and validate the already generated audio pack
        run: |
          mkdir -p output/audio
          curl --fail --location --retry 3 https://github.com/servomasta-web/SERVO-DEUTSCH-B2-AUDIO/releases/download/audio-v1/exam-001.zip --output output/exam-001.zip
          unzip -tq output/exam-001.zip
          unzip -o output/exam-001.zip -d output/audio
          test "$(find output/audio -maxdepth 1 -name '*.mp3' | wc -l)" -eq 8
          for f in output/audio/*.mp3; do test -s "$f"; done
      - name: Publish validated MP3 tracks to the audio repository
        run: |
          mkdir -p audio/exam-001
          cp output/audio/*.mp3 audio/exam-001/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git add audio/exam-001/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated audio tracks for exam 001"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERVO-DEUTSCH-B2-EXAMEN-001-ALIGNED
          path: output/exam-001.zip
          retention-days: 30
      - name: Replace exam 001 asset in the permanent audio release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-v1
          name: SERVO DEUTSCH B2 — Packs audio
          files: output/exam-001.zip
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
